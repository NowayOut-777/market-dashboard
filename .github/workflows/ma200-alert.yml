name: MA200 Alert

on:
  schedule:
    # 21:47 UTC = 미국 장 마감(16:00 ET) 직후, 한국시간 오전 6:47 (서머타임 기준)
    # 정각/10분 단위는 GitHub 혼잡으로 최대 1~2시간 지연되므로 홀수 분을 사용
    - cron: "47 21 * * 1-5"
  workflow_dispatch:
    inputs:
      force_send:
        description: "이벤트가 없어도 현재 상태 메일 발송 (설정 테스트)"
        type: boolean
        default: false

# actions: write — keepalive 단계가 이 워크플로를 API로 재활성화
# issues: write  — 메일 키가 없을 때 이슈로 알림 (GitHub가 소유자 이메일로 전달)
permissions:
  actions: write
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Preflight — 알림 경로 확인
        env:
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
        run: |
          if [ -n "$ALERT_EMAIL_TO" ] && { [ -n "$RESEND_API_KEY" ] || [ -n "$SMTP_USER" ]; }; then
            echo "::notice title=알림 경로::직접 메일 발송 (Resend/SMTP)"
          else
            echo "::notice title=알림 경로::GitHub 이슈 알림 — 소유자 계정 이메일로 전달됨 (메일 키 불필요)"
          fi

      - name: Install dependencies
        run: pip install --quiet yfinance "pandas>=2.0,<3.0" requests

      - name: Check MA200 and send alert
        run: python scripts/check_ma200.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_SEND: ${{ inputs.force_send }}

      # GitHub는 저장소에 60일간 커밋이 없으면 예약 워크플로를 자동으로 끈다.
      # 매 실행 끝에 스스로를 다시 활성화해 비활성화 타이머를 리셋한다.
      - name: Keepalive — 60일 비활성화 방지
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable ma200-alert.yml --repo "$GITHUB_REPOSITORY"
