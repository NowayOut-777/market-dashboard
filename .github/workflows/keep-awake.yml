name: Keep App Awake

on:
  schedule:
    # 매시 17분. 6시간 간격일 때 방문 후 8시간이 안 돼 잠든 적이 있어 1시간마다 확인한다
    # (공개 저장소라 Actions 사용량은 무료)
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install playwright
        run: pip install --quiet playwright

      # 크롬(약 150MB)을 매번 내려받지 않도록 캐시한다 — 키는 playwright 버전별
      - name: Resolve playwright version
        id: pw
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache browser
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw.outputs.version }}

      - name: Install browser
        if: steps.cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install browser system deps
        if: steps.cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Visit dashboard (wake up if sleeping)
        run: python scripts/keep_awake.py

      # GitHub는 저장소에 60일간 커밋이 없으면 예약 워크플로를 자동으로 끈다 — 매 실행마다 재활성화
      - name: Keepalive — 60일 비활성화 방지
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable keep-awake.yml --repo "$GITHUB_REPOSITORY"
